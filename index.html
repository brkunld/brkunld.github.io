<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Burak Ünaldı · Yapım aşamasında</title>
  <meta name="description" content="burakunaldi.me yapım aşamasında. Çok yakında burada.">
  <meta name="robots" content="noindex">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚧</text></svg>">
  <style>
    :root {
      --bg: #f6f5f1;
      --fg: #16161a;
      --muted: #6b6b73;
      --accent: #e8a317;
      --line: #dcdad3;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111114;
        --fg: #ededf0;
        --muted: #8e8e98;
        --accent: #f2b33d;
        --line: #2a2a30;
      }
    }
    * { box-sizing: border-box; margin: 0; }
    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--fg);
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 32px 20px;
      line-height: 1.5;
    }
    main { max-width: 640px; width: 100%; margin: 0 auto; }
    .tape {
      height: 10px;
      width: 120px;
      border-radius: 2px;
      background: repeating-linear-gradient(-45deg, var(--accent) 0 10px, var(--fg) 10px 20px);
      margin-bottom: 32px;
    }
    .domain {
      font-family: ui-monospace, "SF Mono", Consolas, monospace;
      font-size: 14px;
      color: var(--muted);
      margin-bottom: 12px;
    }
    h1 {
      font-size: clamp(36px, 8vw, 64px);
      line-height: 1.05;
      letter-spacing: -0.03em;
      font-weight: 700;
    }
    h1 span { color: var(--accent); }
    p.lead {
      margin-top: 20px;
      font-size: 18px;
      color: var(--muted);
      max-width: 44ch;
    }
    .status {
      margin-top: 40px;
      padding-top: 20px;
      border-top: 1px solid var(--line);
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      color: var(--muted);
    }
    .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--accent);
      animation: pulse 1.6s ease-in-out infinite;
    }
    @keyframes pulse { 50% { opacity: .25; } }
    @media (prefers-reduced-motion: reduce) { .dot { animation: none; } }
    a { color: inherit; }
  </style>
</head>
<body>
  <main>
    <div class="tape" aria-hidden="true"></div>
    <div class="domain">burakunaldi.me</div>
    <h1>Bu sayfa inşa<br>ediliyor<span>.</span></h1>
    <p class="lead">Projelerim ve yazılarım çok yakında burada olacak. Şimdilik iskele kuruluyor.</p>
    <div class="status"><span class="dot" aria-hidden="true"></span>Yapım aşamasında · <a href="https://github.com/brkunld">github.com/brkunld</a></div>
  </main>
</body>
</html>
