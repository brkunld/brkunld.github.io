<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Burak Ünaldı · Projeler</title>
  <meta name="description" content="Burak Ünaldı'nın yazılım projeleri.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
  <style>
    :root {
      --bg: #f4f4f2;
      --surface: #ffffff;
      --fg: #18181b;
      --muted: #5f5f67;
      --line: #e1e1dd;
      --accent: #c2410c;
      --accent-soft: #fbeee6;
      --radius: 14px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111113;
        --surface: #19191c;
        --fg: #ececee;
        --muted: #9a9aa3;
        --line: #2a2a2f;
        --accent: #fb8a4c;
        --accent-soft: #2a1a12;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--fg);
      font-family: "Geist", ui-sans-serif, system-ui, "Segoe UI", sans-serif;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; text-decoration: none; }
    .wrap { max-width: 1080px; margin: 0 auto; padding: 0 16px; }
    @media (min-width: 768px) { .wrap { padding: 0 32px; } }

    header { padding: 72px 0 56px; }
    @media (min-width: 768px) { header { padding: 96px 0 72px; } }
    .domain {
      font-family: "Geist Mono", ui-monospace, monospace;
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 16px;
    }
    h1 {
      font-size: clamp(36px, 7vw, 60px);
      line-height: 1.05;
      letter-spacing: -0.035em;
      font-weight: 700;
    }
    .title { margin-top: 10px; font-size: 18px; color: var(--muted); }
    .intro { margin-top: 20px; max-width: 58ch; font-size: 17px; }
    .profiles { margin-top: 32px; display: flex; flex-wrap: wrap; gap: 10px; }
    .profile {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 10px 16px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--surface);
      font-size: 15px; font-weight: 500;
      transition: border-color .2s, transform .2s cubic-bezier(.16,1,.3,1);
    }
    .profile i { font-size: 18px; }
    @media (max-width: 480px) {
      .profiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(0, 1fr)); gap: 8px; }
      .profile { justify-content: center; padding: 10px 8px; font-size: 14px; gap: 6px; }
    }
    .profile:hover { border-color: var(--accent); }
    .profile:active { transform: scale(.98); }

    main { padding-bottom: 96px; }
    h2 {
      font-size: 22px; font-weight: 600; letter-spacing: -0.02em;
      padding-top: 32px; border-top: 1px solid var(--line);
      margin-bottom: 28px;
    }
    .projects { display: grid; grid-template-columns: 1fr; gap: 20px; }
    @media (min-width: 768px) { .projects { grid-template-columns: 1fr 1fr; } }
    .project {
      display: flex; flex-direction: column;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      overflow: hidden;
    }
    .project > img {
      display: block; width: 100%; aspect-ratio: 16 / 10; object-fit: cover;
      border-bottom: 1px solid var(--line);
    }
    .project-body { padding: 24px; display: flex; flex-direction: column; gap: 14px; flex: 1; }
    .project-head { display: flex; align-items: center; gap: 14px; }
    .project-head img {
      width: 48px; height: 48px; flex: none;
      border-radius: 12px; object-fit: contain;
      background: #ffffff; border: 1px solid var(--line);
    }
    .project h3 { font-size: 24px; font-weight: 600; letter-spacing: -0.02em; }
    .project p { color: var(--muted); }
    .tags { display: flex; flex-wrap: wrap; gap: 6px; }
    .tag {
      font-family: "Geist Mono", ui-monospace, monospace;
      font-size: 12px;
      padding: 3px 9px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent);
    }
    .links { margin-top: auto; padding-top: 6px; display: flex; gap: 18px; }
    .links a {
      display: inline-flex; align-items: center; gap: 6px;
      font-weight: 500; font-size: 15px;
      border-bottom: 1px solid transparent;
      transition: border-color .2s;
    }
    .links a:hover { border-color: currentColor; }

    .skeleton { background: var(--line); border-radius: 8px; animation: shimmer 1.4s ease-in-out infinite; }
    @keyframes shimmer { 50% { opacity: .5; } }
    .notice { color: var(--muted); padding: 24px 0; }

    footer { padding: 32px 0 48px; color: var(--muted); font-size: 14px; border-top: 1px solid var(--line); }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; animation: none !important; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header id="hero" aria-busy="true">
      <div class="domain">burakunaldi.me</div>
      <div class="skeleton" style="height:56px;max-width:420px"></div>
      <div class="skeleton" style="height:20px;max-width:260px;margin-top:16px"></div>
    </header>

    <main>
      <h2>Projeler</h2>
      <div class="projects" id="projects">
        <div class="skeleton" style="height:280px"></div>
        <div class="skeleton" style="height:280px"></div>
      </div>
    </main>

    <footer id="footer"></footer>
  </div>

  <script>
    const ICONS = { github: "ph-github-logo", linkedin: "ph-linkedin-logo", email: "ph-envelope-simple", web: "ph-globe" };

    function esc(value) {
      return String(value ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }

    function safeUrl(url) {
      const u = String(url ?? "").trim();
      return /^(https?:|mailto:|\/)/i.test(u) ? u : "";
    }

    function external(url) {
      return /^https?:/i.test(url) ? ' target="_blank" rel="noopener"' : "";
    }

    function renderHero(site) {
      const profiles = (site.profiles || []).filter(p => safeUrl(p.url)).map(p => {
        const url = safeUrl(p.url);
        return `<a class="profile" href="${esc(url)}"${external(url)}><i class="ph ${ICONS[p.icon] || ICONS.web}" aria-hidden="true"></i>${esc(p.label)}</a>`;
      }).join("");
      const hero = document.getElementById("hero");
      hero.innerHTML = `
        <div class="domain">burakunaldi.me</div>
        <h1>${esc(site.name)}</h1>
        ${site.title ? `<p class="title">${esc(site.title)}</p>` : ""}
        ${site.intro ? `<p class="intro">${esc(site.intro)}</p>` : ""}
        ${profiles ? `<nav class="profiles" aria-label="Profiller">${profiles}</nav>` : ""}`;
      hero.removeAttribute("aria-busy");
    }

    function renderProjects(projects) {
      const box = document.getElementById("projects");
      if (!projects.length) {
        box.outerHTML = `<p class="notice">Henüz proje eklenmedi.</p>`;
        return;
      }
      box.innerHTML = projects.map(p => {
        const img = safeUrl(p.image);
        const logo = safeUrl(p.logo);
        const repo = safeUrl(p.repo);
        const live = safeUrl(p.live);
        const tags = (p.tags || []).map(t => `<span class="tag">${esc(t)}</span>`).join("");
        return `
          <article class="project">
            ${img ? `<img src="${esc(img)}" alt="${esc(p.name)} ekran görüntüsü" loading="lazy">` : ""}
            <div class="project-body">
              <div class="project-head">
                ${logo ? `<img src="${esc(logo)}" alt="" width="48" height="48">` : ""}
                <h3>${esc(p.name)}</h3>
              </div>
              ${p.summary ? `<p>${esc(p.summary)}</p>` : ""}
              ${tags ? `<div class="tags">${tags}</div>` : ""}
              <div class="links">
                ${repo ? `<a href="${esc(repo)}"${external(repo)}><i class="ph ph-code" aria-hidden="true"></i>Kod</a>` : ""}
                ${live ? `<a href="${esc(live)}"${external(live)}><i class="ph ph-arrow-up-right" aria-hidden="true"></i>Canlı</a>` : ""}
              </div>
            </div>
          </article>`;
      }).join("");
    }

    fetch("data/site.json", { cache: "no-cache" })
      .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(site => {
        document.title = `${site.name} · Projeler`;
        renderHero(site);
        renderProjects(site.projects || []);
        document.getElementById("footer").textContent = `© ${new Date().getFullYear()} ${site.name}`;
      })
      .catch(() => {
        document.getElementById("hero").innerHTML = `<div class="domain">burakunaldi.me</div><h1>Burak Ünaldı</h1>`;
        document.getElementById("projects").outerHTML = `<p class="notice">Projeler şu an yüklenemedi. Sayfayı yenilemeyi dene.</p>`;
      });
  </script>
</body>
</html>
